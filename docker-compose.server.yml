services:
  review-agent:
    container_name: review-agent-service
    build:
      context: ./review-agent-service
      dockerfile: Dockerfile
    image: review-agent-service:main
    restart: unless-stopped
    env_file:
      - ./review-agent-service/.env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:18110:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
