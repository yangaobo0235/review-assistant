<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><title>脱敏挂靠字段夹具</title></head>
  <body>
    <!-- 脱敏夹具：仅保留审核页面确认的 Ant Design 挂靠控件结构。 -->
    <form class="ant-form ant-form-vertical">
      <div class="ant-form-item">
        <div class="ant-form-item-label"><label>报废车挂靠</label></div>
        <div class="ant-form-item-control">
          <div class="ant-select ant-select-single ant-select-show-arrow">
            <div class="ant-select-selector">
              <span class="ant-select-selection-placeholder">请选择</span>
              <input role="combobox" aria-controls="affiliation-old-options" aria-expanded="false" value="">
            </div>
          </div>
        </div>
      </div>
      <div class="ant-form-item">
        <div class="ant-form-item-label"><label>新车挂靠</label></div>
        <div class="ant-form-item-control">
          <div class="ant-select ant-select-single ant-select-show-arrow">
            <div class="ant-select-selector">
              <span class="ant-select-selection-item">企业</span>
              <input role="combobox" aria-controls="affiliation-new-options" aria-expanded="false" value="企业">
            </div>
          </div>
        </div>
      </div>
    </form>
    <div id="affiliation-old-options" role="listbox">
      <div role="option">个人</div>
      <div role="option">公司</div>
    </div>
    <div id="affiliation-new-options" role="listbox">
      <div role="option">个人</div>
      <div role="option">企业</div>
    </div>
  </body>
</html>
